<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Organization chart" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Org chart — template</title>
  <desc>Dossier-style organization chart. Amber for load-bearing roles; ink for standard roles.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');

      .chrome-file { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #5A5042; letter-spacing: 0.06em; }
      .chrome-classification { font-family: 'Inter Tight', sans-serif; font-size: 11px; font-weight: 600; fill: #D6743A; letter-spacing: 0.18em; text-transform: uppercase; }
      .chrome-section { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #5A5042; letter-spacing: 0.06em; text-transform: uppercase; }

      .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #8A4824; letter-spacing: 0.18em; text-transform: uppercase; }
      .figure-title { font-family: 'Inter Tight', sans-serif; font-size: 28px; font-weight: 400; fill: #F0E6D0; letter-spacing: -0.03em; }
      .figure-subtitle { font-family: 'Inter Tight', sans-serif; font-size: 15px; fill: #8A7E6A; }

      .role-title { font-family: 'Inter Tight', sans-serif; font-size: 13px; font-weight: 500; fill: #F0E6D0; }
      .role-title-signal { fill: #D6743A; }
      .role-name { font-family: 'Inter Tight', sans-serif; font-size: 11px; fill: #D8CDB8; }
      .role-meta { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #8A7E6A; letter-spacing: 0.06em; }
      .team-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #8A4824; letter-spacing: 0.18em; text-transform: uppercase; }

      .rule-hairline { stroke: #2A2620; stroke-width: 1; fill: none; }
      .rule-bright { stroke: #3D362C; stroke-width: 1; fill: none; }

      .role-box-standard { fill: #131210; stroke: #2A2620; stroke-width: 1; }
      .role-box-signal { fill: #1A1815; stroke: #8A4824; stroke-width: 1.5; }
      .role-box-emphasis { fill: #1A1815; stroke: #3D362C; stroke-width: 1; }

      .reporting-line { stroke: #5A5042; stroke-width: 1; fill: none; }

      .caption-mono { font-family: 'JetBrains Mono', monospace; font-size: 8px; fill: #5A5042; letter-spacing: 0.05em; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#0C0B08" />

  <!-- Top chrome -->
  <text x="40" y="34" class="chrome-file">FILE-C9D-FIG-2026-XXX</text>
  <text x="600" y="34" class="chrome-classification" text-anchor="middle">CLIENT CONFIDENTIAL</text>
  <text x="1160" y="34" class="chrome-section" text-anchor="end">§ FIG-04 / ORG</text>
  <line x1="40" y1="52" x2="1160" y2="52" class="rule-hairline" />

  <!-- Figure header -->
  <text x="40" y="98" class="eyebrow">FIG. 04 — ORGANIZATION</text>
  <text x="40" y="140" class="figure-title">Org chart template.</text>
  <text x="40" y="168" class="figure-subtitle">Standard hierarchy with amber emphasis on load-bearing roles.</text>

  <line x1="40" y1="195" x2="200" y2="195" class="rule-bright" />

  <!-- ============================================================
       TIER 01 — Executive
       ============================================================ -->
  <text x="40" y="240" class="team-label">TIER 01 · EXECUTIVE</text>

  <g transform="translate(500, 260)">
    <rect x="0" y="0" width="200" height="80" class="role-box-signal" />
    <text x="16" y="22" class="role-meta" fill="#8A4824">CEO</text>
    <text x="16" y="44" class="role-title role-title-signal">Role title</text>
    <text x="16" y="62" class="role-name">Person Name</text>
    <text x="16" y="76" class="role-meta">Direct: 4</text>
  </g>

  <!-- Reporting line from CEO -->
  <line x1="600" y1="340" x2="600" y2="390" class="reporting-line" />
  <line x1="220" y1="390" x2="980" y2="390" class="reporting-line" />
  <line x1="220" y1="390" x2="220" y2="425" class="reporting-line" />
  <line x1="480" y1="390" x2="480" y2="425" class="reporting-line" />
  <line x1="740" y1="390" x2="740" y2="425" class="reporting-line" />
  <line x1="980" y1="390" x2="980" y2="425" class="reporting-line" />

  <!-- ============================================================
       TIER 02 — Direct reports
       ============================================================ -->
  <text x="40" y="415" class="team-label">TIER 02 · FUNCTIONAL LEADS</text>

  <!-- CTO -->
  <g transform="translate(120, 430)">
    <rect x="0" y="0" width="200" height="80" class="role-box-signal" />
    <text x="16" y="22" class="role-meta" fill="#8A4824">CTO</text>
    <text x="16" y="44" class="role-title role-title-signal">Role title</text>
    <text x="16" y="62" class="role-name">Person Name</text>
    <text x="16" y="76" class="role-meta">Direct: 4</text>
  </g>

  <!-- CFO -->
  <g transform="translate(380, 430)">
    <rect x="0" y="0" width="200" height="80" class="role-box-standard" />
    <text x="16" y="22" class="role-meta">CFO</text>
    <text x="16" y="44" class="role-title">Role title</text>
    <text x="16" y="62" class="role-name">Person Name</text>
    <text x="16" y="76" class="role-meta">Direct: 3</text>
  </g>

  <!-- COO -->
  <g transform="translate(640, 430)">
    <rect x="0" y="0" width="200" height="80" class="role-box-standard" />
    <text x="16" y="22" class="role-meta">COO</text>
    <text x="16" y="44" class="role-title">Role title</text>
    <text x="16" y="62" class="role-name">Person Name</text>
    <text x="16" y="76" class="role-meta">Direct: 5</text>
  </g>

  <!-- Head of AI -->
  <g transform="translate(880, 430)">
    <rect x="0" y="0" width="200" height="80" class="role-box-signal" />
    <text x="16" y="22" class="role-meta" fill="#8A4824">HEAD OF AI</text>
    <text x="16" y="44" class="role-title role-title-signal">Role title</text>
    <text x="16" y="62" class="role-name">Person Name</text>
    <text x="16" y="76" class="role-meta">Direct: 6</text>
  </g>

  <!-- Reporting lines to Tier 3 -->
  <line x1="220" y1="510" x2="220" y2="560" class="reporting-line" />
  <line x1="110" y1="560" x2="330" y2="560" class="reporting-line" />
  <line x1="110" y1="560" x2="110" y2="595" class="reporting-line" />
  <line x1="330" y1="560" x2="330" y2="595" class="reporting-line" />

  <line x1="740" y1="510" x2="740" y2="560" class="reporting-line" />
  <line x1="630" y1="560" x2="850" y2="560" class="reporting-line" />
  <line x1="630" y1="560" x2="630" y2="595" class="reporting-line" />
  <line x1="850" y1="560" x2="850" y2="595" class="reporting-line" />

  <line x1="980" y1="510" x2="980" y2="595" class="reporting-line" />

  <!-- ============================================================
       TIER 03 — ICs / Team leads
       ============================================================ -->
  <text x="40" y="585" class="team-label">TIER 03 · TEAMS</text>

  <!-- Team A -->
  <g transform="translate(10, 600)">
    <rect x="0" y="0" width="200" height="70" class="role-box-emphasis" />
    <text x="16" y="22" class="role-meta">TEAM A · ENG</text>
    <text x="16" y="44" class="role-title">Platform</text>
    <text x="16" y="62" class="role-name">6 engineers</text>
  </g>

  <!-- Team B -->
  <g transform="translate(230, 600)">
    <rect x="0" y="0" width="200" height="70" class="role-box-emphasis" />
    <text x="16" y="22" class="role-meta">TEAM B · ENG</text>
    <text x="16" y="44" class="role-title">Product</text>
    <text x="16" y="62" class="role-name">8 engineers</text>
  </g>

  <!-- Team C -->
  <g transform="translate(530, 600)">
    <rect x="0" y="0" width="200" height="70" class="role-box-emphasis" />
    <text x="16" y="22" class="role-meta">TEAM C · OPS</text>
    <text x="16" y="44" class="role-title">Customer ops</text>
    <text x="16" y="62" class="role-name">4 staff</text>
  </g>

  <!-- Team D -->
  <g transform="translate(750, 600)">
    <rect x="0" y="0" width="200" height="70" class="role-box-emphasis" />
    <text x="16" y="22" class="role-meta">TEAM D · OPS</text>
    <text x="16" y="44" class="role-title">Finance ops</text>
    <text x="16" y="62" class="role-name">3 staff</text>
  </g>

  <!-- Team E -->
  <g transform="translate(880, 600)">
    <rect x="0" y="0" width="200" height="70" class="role-box-signal" />
    <text x="16" y="22" class="role-meta" fill="#8A4824">TEAM E · AI</text>
    <text x="16" y="44" class="role-title role-title-signal">Agentic AI</text>
    <text x="16" y="62" class="role-name">6 engineers</text>
  </g>

  <!-- ============================================================
       Legend
       ============================================================ -->
  <g transform="translate(40, 700)">
    <text x="0" y="0" class="eyebrow">LEGEND</text>

    <rect x="0" y="12" width="16" height="12" class="role-box-signal" />
    <text x="24" y="22" class="role-name">Load-bearing role</text>

    <rect x="200" y="12" width="16" height="12" class="role-box-standard" />
    <text x="224" y="22" class="role-name">Standard functional</text>

    <rect x="400" y="12" width="16" height="12" class="role-box-emphasis" />
    <text x="424" y="22" class="role-name">Team unit</text>
  </g>

  <!-- Bottom chrome -->
  <line x1="40" y1="745" x2="1160" y2="745" class="rule-hairline" />
  <text x="40" y="765" class="caption-mono">FIG. 04 — ORG STRUCTURE · AMBER OUTLINES LOAD-BEARING ROLES · REPORTING LINES IN INK</text>
  <text x="1160" y="765" class="caption-mono" text-anchor="end">C9D CONSULTING · DOSSIER FIG. TEMPLATE</text>
</svg>
