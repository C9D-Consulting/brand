<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-label="Decision framework diagram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Decision framework — template</title>
  <desc>Dossier-style decision framework with branching logic. Amber for decision nodes; classified red for kill criteria.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');

      .chrome-file { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #5A5042; letter-spacing: 0.06em; }
      .chrome-classification { font-family: 'Inter Tight', sans-serif; font-size: 11px; font-weight: 600; fill: #D6743A; letter-spacing: 0.18em; text-transform: uppercase; }
      .chrome-section { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #5A5042; letter-spacing: 0.06em; text-transform: uppercase; }

      .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #8A4824; letter-spacing: 0.18em; text-transform: uppercase; }
      .figure-title { font-family: 'Inter Tight', sans-serif; font-size: 28px; font-weight: 400; fill: #F0E6D0; letter-spacing: -0.03em; }
      .figure-subtitle { font-family: 'Inter Tight', sans-serif; font-size: 15px; fill: #8A7E6A; }

      .node-id { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #8A7E6A; letter-spacing: 0.08em; }
      .node-title { font-family: 'Inter Tight', sans-serif; font-size: 14px; font-weight: 500; fill: #F0E6D0; }
      .node-body { font-family: 'Inter Tight', sans-serif; font-size: 11px; fill: #D8CDB8; }

      .decision-title { fill: #D6743A; }
      .kill-title { fill: #C0392B; }

      .rule-hairline { stroke: #2A2620; stroke-width: 1; fill: none; }
      .rule-bright { stroke: #3D362C; stroke-width: 1; fill: none; }

      .node-decision { fill: #1A1815; stroke: #8A4824; stroke-width: 1.5; }
      .node-standard { fill: #131210; stroke: #2A2620; stroke-width: 1; }
      .node-outcome-yes { fill: #131210; stroke: #3D362C; stroke-width: 1; }
      .node-outcome-kill { fill: #1A1210; stroke: #8B2A20; stroke-width: 1.5; }

      .branch-line { stroke: #5A5042; stroke-width: 1; fill: none; }
      .branch-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #8A7E6A; letter-spacing: 0.06em; text-transform: uppercase; }
      .branch-label-yes { fill: #8A4824; }
      .branch-label-no { fill: #8B2A20; }

      .caption-mono { font-family: 'JetBrains Mono', monospace; font-size: 8px; fill: #5A5042; letter-spacing: 0.05em; }
    </style>

    <marker id="arrow-ink-dm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A5042" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="850" fill="#0C0B08" />

  <!-- Top chrome -->
  <text x="40" y="34" class="chrome-file">FILE-C9D-FIG-2026-XXX</text>
  <text x="600" y="34" class="chrome-classification" text-anchor="middle">CLIENT CONFIDENTIAL</text>
  <text x="1160" y="34" class="chrome-section" text-anchor="end">§ FIG-02 / DECISION</text>
  <line x1="40" y1="52" x2="1160" y2="52" class="rule-hairline" />

  <!-- Figure header -->
  <text x="40" y="98" class="eyebrow">FIG. 02 — DECISION FRAMEWORK</text>
  <text x="40" y="140" class="figure-title">Decision framework template.</text>
  <text x="40" y="168" class="figure-subtitle">Decision nodes in amber. Kill criteria in classified red. Standard flow in ink.</text>

  <line x1="40" y1="195" x2="200" y2="195" class="rule-bright" />

  <!-- ============================================================
       TRIGGER (starting point)
       ============================================================ -->
  <g transform="translate(475, 230)">
    <rect x="0" y="0" width="250" height="70" class="node-standard" />
    <text x="16" y="22" class="node-id">TRIGGER · 00</text>
    <text x="16" y="44" class="node-title">Decision triggered</text>
    <text x="16" y="60" class="node-body">Replace with actual trigger event</text>
  </g>

  <!-- Line to first decision -->
  <line x1="600" y1="300" x2="600" y2="335" class="branch-line" marker-end="url(#arrow-ink-dm)" />

  <!-- ============================================================
       DECISION NODE 01
       ============================================================ -->
  <g transform="translate(475, 340)">
    <rect x="0" y="0" width="250" height="70" class="node-decision" />
    <text x="16" y="22" class="node-id" fill="#8A4824">DECISION · 01</text>
    <text x="16" y="44" class="node-title decision-title">Question one?</text>
    <text x="16" y="60" class="node-body">Kill criterion / condition</text>
  </g>

  <!-- Branch YES / NO -->
  <line x1="475" y1="410" x2="300" y2="440" class="branch-line" marker-end="url(#arrow-ink-dm)" />
  <line x1="725" y1="410" x2="900" y2="440" class="branch-line" marker-end="url(#arrow-ink-dm)" />

  <text x="380" y="430" class="branch-label branch-label-yes">YES</text>
  <text x="820" y="430" class="branch-label branch-label-no">NO / KILL</text>

  <!-- ============================================================
       BRANCH LEFT — Continue path
       ============================================================ -->
  <g transform="translate(175, 445)">
    <rect x="0" y="0" width="250" height="70" class="node-standard" />
    <text x="16" y="22" class="node-id">STEP · 02</text>
    <text x="16" y="44" class="node-title">Continue path</text>
    <text x="16" y="60" class="node-body">Next required work</text>
  </g>

  <line x1="300" y1="515" x2="300" y2="555" class="branch-line" marker-end="url(#arrow-ink-dm)" />

  <!-- Decision node 02 -->
  <g transform="translate(175, 560)">
    <rect x="0" y="0" width="250" height="70" class="node-decision" />
    <text x="16" y="22" class="node-id" fill="#8A4824">DECISION · 03</text>
    <text x="16" y="44" class="node-title decision-title">Question two?</text>
    <text x="16" y="60" class="node-body">Second gate condition</text>
  </g>

  <line x1="175" y1="630" x2="175" y2="670" class="branch-line" marker-end="url(#arrow-ink-dm)" />
  <line x1="425" y1="630" x2="600" y2="670" class="branch-line" marker-end="url(#arrow-ink-dm)" />

  <text x="150" y="655" class="branch-label branch-label-yes">YES</text>
  <text x="490" y="655" class="branch-label branch-label-yes">PARTIAL</text>

  <!-- Outcome A (bottom-left) -->
  <g transform="translate(50, 675)">
    <rect x="0" y="0" width="250" height="70" class="node-outcome-yes" />
    <text x="16" y="22" class="node-id">OUTCOME · A</text>
    <text x="16" y="44" class="node-title">Ship</text>
    <text x="16" y="60" class="node-body">Recommendation stands</text>
  </g>

  <!-- Outcome B (bottom-center) -->
  <g transform="translate(475, 675)">
    <rect x="0" y="0" width="250" height="70" class="node-outcome-yes" />
    <text x="16" y="22" class="node-id">OUTCOME · B</text>
    <text x="16" y="44" class="node-title">Ship with mitigation</text>
    <text x="16" y="60" class="node-body">Documented risks + kill dates</text>
  </g>

  <!-- ============================================================
       BRANCH RIGHT — Kill outcome
       ============================================================ -->
  <g transform="translate(775, 445)">
    <rect x="0" y="0" width="250" height="70" class="node-outcome-kill" />
    <text x="16" y="22" class="node-id" fill="#8B2A20">OUTCOME · KILL</text>
    <text x="16" y="44" class="node-title kill-title">Stop call</text>
    <text x="16" y="60" class="node-body">Do not proceed. Document rationale.</text>
  </g>

  <!-- ============================================================
       Legend
       ============================================================ -->
  <g transform="translate(40, 770)">
    <text x="0" y="0" class="eyebrow">LEGEND</text>

    <rect x="0" y="12" width="16" height="12" class="node-standard" />
    <text x="24" y="22" class="node-body">Standard flow</text>

    <rect x="140" y="12" width="16" height="12" class="node-decision" />
    <text x="164" y="22" class="node-body">Decision node</text>

    <rect x="290" y="12" width="16" height="12" class="node-outcome-kill" />
    <text x="314" y="22" class="node-body">Kill / stop call</text>

    <rect x="440" y="12" width="16" height="12" class="node-outcome-yes" />
    <text x="464" y="22" class="node-body">Outcome (ship)</text>
  </g>

  <!-- Bottom chrome -->
  <line x1="40" y1="810" x2="1160" y2="810" class="rule-hairline" />
  <text x="40" y="830" class="caption-mono">FIG. 02 — DECISION FRAMEWORK · AMBER OUTLINES DECISIONS · RED OUTLINES KILL</text>
  <text x="1160" y="830" class="caption-mono" text-anchor="end">C9D CONSULTING · DOSSIER FIG. TEMPLATE</text>
</svg>
