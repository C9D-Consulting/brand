<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Timeline roadmap diagram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Timeline / roadmap — template</title>
  <desc>Dossier-style timeline with phase markers. Amber for milestones, hairlines for phase boundaries.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');

      .chrome-file { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #5A5042; letter-spacing: 0.06em; }
      .chrome-classification { font-family: 'Inter Tight', sans-serif; font-size: 11px; font-weight: 600; fill: #D6743A; letter-spacing: 0.18em; text-transform: uppercase; }
      .chrome-section { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #5A5042; letter-spacing: 0.06em; text-transform: uppercase; }

      .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #8A4824; letter-spacing: 0.18em; text-transform: uppercase; }
      .figure-title { font-family: 'Inter Tight', sans-serif; font-size: 28px; font-weight: 400; fill: #F0E6D0; letter-spacing: -0.03em; }
      .figure-subtitle { font-family: 'Inter Tight', sans-serif; font-size: 15px; fill: #8A7E6A; }

      .phase-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; fill: #8A4824; letter-spacing: 0.18em; text-transform: uppercase; }
      .phase-title { font-family: 'Inter Tight', sans-serif; font-size: 18px; font-weight: 400; fill: #F0E6D0; letter-spacing: -0.02em; }
      .phase-desc { font-family: 'Inter Tight', sans-serif; font-size: 12px; fill: #D8CDB8; }
      .phase-meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #8A7E6A; letter-spacing: 0.06em; }

      .milestone-title { font-family: 'Inter Tight', sans-serif; font-size: 13px; font-weight: 500; fill: #D6743A; }
      .milestone-body { font-family: 'Inter Tight', sans-serif; font-size: 11px; fill: #8A7E6A; }

      .rule-hairline { stroke: #2A2620; stroke-width: 1; fill: none; }
      .rule-bright { stroke: #3D362C; stroke-width: 1; fill: none; }

      .caption-mono { font-family: 'JetBrains Mono', monospace; font-size: 8px; fill: #5A5042; letter-spacing: 0.05em; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="600" fill="#0C0B08" />

  <!-- Top chrome -->
  <text x="40" y="34" class="chrome-file">FILE-C9D-FIG-2026-XXX</text>
  <text x="600" y="34" class="chrome-classification" text-anchor="middle">CLIENT CONFIDENTIAL</text>
  <text x="1160" y="34" class="chrome-section" text-anchor="end">§ FIG-03 / ROADMAP</text>
  <line x1="40" y1="52" x2="1160" y2="52" class="rule-hairline" />

  <!-- Figure header -->
  <text x="40" y="98" class="eyebrow">FIG. 03 — ENGAGEMENT TIMELINE</text>
  <text x="40" y="140" class="figure-title">Timeline roadmap template.</text>
  <text x="40" y="168" class="figure-subtitle">Three-phase engagement with milestone markers. Amber dots mark inflection points.</text>

  <line x1="40" y1="195" x2="200" y2="195" class="rule-bright" />

  <!-- ============================================================
       TIMELINE — horizontal axis
       ============================================================ -->

  <!-- Baseline rule -->
  <line x1="80" y1="310" x2="1120" y2="310" stroke="#3D362C" stroke-width="1" />

  <!-- Phase dividers (vertical hairlines) -->
  <line x1="80" y1="240" x2="80" y2="450" class="rule-hairline" />
  <line x1="360" y1="240" x2="360" y2="450" class="rule-hairline" />
  <line x1="640" y1="240" x2="640" y2="450" class="rule-hairline" />
  <line x1="920" y1="240" x2="920" y2="450" class="rule-hairline" />
  <line x1="1120" y1="240" x2="1120" y2="450" class="rule-hairline" />

  <!-- ============================================================
       PHASE I
       ============================================================ -->
  <text x="90" y="260" class="phase-label">PHASE I · DIAGNOSTIC</text>
  <text x="90" y="284" class="phase-meta">WEEKS 01 — 04</text>
  <text x="90" y="360" class="phase-title">Assess</text>
  <text x="90" y="386" class="phase-desc">Diagnostic against current</text>
  <text x="90" y="402" class="phase-desc">state. Documented findings.</text>

  <!-- Milestone dot on baseline -->
  <circle cx="240" cy="310" r="6" fill="#D6743A" />
  <line x1="240" y1="310" x2="240" y2="335" stroke="#8A4824" stroke-width="1" />
  <text x="240" y="352" class="milestone-title" text-anchor="middle">M-01</text>
  <text x="240" y="368" class="milestone-body" text-anchor="middle">Findings memo</text>

  <!-- ============================================================
       PHASE II
       ============================================================ -->
  <text x="370" y="260" class="phase-label">PHASE II · PLAYBOOK</text>
  <text x="370" y="284" class="phase-meta">WEEKS 05 — 10</text>
  <text x="370" y="360" class="phase-title">Design</text>
  <text x="370" y="386" class="phase-desc">Playbook + roadmap. Working</text>
  <text x="370" y="402" class="phase-desc">sessions with named principals.</text>

  <!-- Milestone dot -->
  <circle cx="520" cy="310" r="6" fill="#D6743A" />
  <line x1="520" y1="310" x2="520" y2="335" stroke="#8A4824" stroke-width="1" />
  <text x="520" y="352" class="milestone-title" text-anchor="middle">M-02</text>
  <text x="520" y="368" class="milestone-body" text-anchor="middle">Playbook v1.0</text>

  <!-- ============================================================
       PHASE III
       ============================================================ -->
  <text x="650" y="260" class="phase-label">PHASE III · HANDOFF</text>
  <text x="650" y="284" class="phase-meta">WEEKS 11 — 14</text>
  <text x="650" y="360" class="phase-title">Transfer</text>
  <text x="650" y="386" class="phase-desc">Documentation pack. Close</text>
  <text x="650" y="402" class="phase-desc">memo. Optional retainer entry.</text>

  <!-- Milestone dot -->
  <circle cx="800" cy="310" r="6" fill="#D6743A" />
  <line x1="800" y1="310" x2="800" y2="335" stroke="#8A4824" stroke-width="1" />
  <text x="800" y="352" class="milestone-title" text-anchor="middle">M-03</text>
  <text x="800" y="368" class="milestone-body" text-anchor="middle">Handoff pack</text>

  <!-- ============================================================
       CLOSE
       ============================================================ -->
  <text x="930" y="260" class="phase-label">CLOSE</text>
  <text x="930" y="284" class="phase-meta">WEEK 14+</text>
  <text x="930" y="360" class="phase-title">Sign off</text>
  <text x="930" y="386" class="phase-desc">Engagement close memo.</text>
  <text x="930" y="402" class="phase-desc">Retainer conversion path open.</text>

  <!-- Final milestone dot -->
  <circle cx="1080" cy="310" r="6" fill="#D6743A" />
  <line x1="1080" y1="310" x2="1080" y2="335" stroke="#8A4824" stroke-width="1" />
  <text x="1080" y="352" class="milestone-title" text-anchor="middle">CLOSE</text>
  <text x="1080" y="368" class="milestone-body" text-anchor="middle">Sign-off</text>

  <!-- ============================================================
       Legend row
       ============================================================ -->
  <g transform="translate(40, 490)">
    <text x="0" y="0" class="eyebrow">LEGEND</text>

    <circle cx="8" cy="18" r="6" fill="#D6743A" />
    <text x="24" y="22" class="phase-desc">Milestone</text>

    <line x1="120" y1="18" x2="140" y2="18" stroke="#3D362C" stroke-width="1" />
    <text x="150" y="22" class="phase-desc">Phase boundary</text>

    <line x1="280" y1="18" x2="300" y2="18" stroke="#3D362C" stroke-width="1" />
    <text x="310" y="22" class="phase-desc">Timeline baseline</text>
  </g>

  <!-- Bottom chrome -->
  <line x1="40" y1="550" x2="1160" y2="550" class="rule-hairline" />
  <text x="40" y="572" class="caption-mono">FIG. 03 — TIMELINE / ROADMAP · AMBER DOTS MARK MILESTONES · TIMESPANS ADJUSTABLE</text>
  <text x="1160" y="572" class="caption-mono" text-anchor="end">C9D CONSULTING · DOSSIER FIG. TEMPLATE</text>
</svg>
